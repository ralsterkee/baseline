[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ralsterkee-baseline"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别评测的先验基线上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ralsterkee" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ralsterkee.github.io"
Repository = "https://github.com/ralsterkee/baseline"
Issues = "https://github.com/ralsterkee/baseline/issues"

[project.scripts]
baseline = "baseline:main"

[tool.setuptools]
py-modules = ["baseline"]
